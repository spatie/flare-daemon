name: Publish Docker Image

on:
  release:
    types: [released]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          full="${RELEASE_TAG#v}"
          IFS='.' read -r major minor _ <<< "${full}"
          {
            echo "full=${full}"
            echo "major=${major}"
            echo "minor=${major}.${minor}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and smoke-test Docker image
        env:
          FLARE_DAEMON_VERSION: ${{ steps.version.outputs.full }}
        run: bash tests/smoke/docker.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FLARE_DAEMON_VERSION=${{ steps.version.outputs.full }}
          tags: |
            ghcr.io/spatie/flare-daemon:v${{ steps.version.outputs.full }}
            ghcr.io/spatie/flare-daemon:v${{ steps.version.outputs.minor }}
            ghcr.io/spatie/flare-daemon:v${{ steps.version.outputs.major }}
            ghcr.io/spatie/flare-daemon:latest
