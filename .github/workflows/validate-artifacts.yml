name: Validate Artifacts

on:
  push:
    paths:
      - 'bin/**'
      - 'build.sh'
      - 'box.json.dist'
      - 'charts/**'
      - 'composer.json'
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/publish-helm-chart.yml'
      - '.github/workflows/validate-artifacts.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'build.sh'
      - 'box.json.dist'
      - 'charts/**'
      - 'composer.json'
      - 'Dockerfile'
      - 'docker/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/publish-helm-chart.yml'
      - '.github/workflows/validate-artifacts.yml'

jobs:
  phar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: bash tests/smoke/phar.sh

      - run: git diff --exit-code -- build/daemon.phar

  composer-bin:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: bash tests/smoke/composer-bin.sh

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - run: bash tests/smoke/docker.sh

  helm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4

      - run: helm lint charts/flare-daemon

      - run: helm template flare-daemon charts/flare-daemon

      - run: helm package charts/flare-daemon --destination dist --version 1.2.3 --app-version v1.2.3
